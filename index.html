
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Image Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            background: #10141c;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        #status {
            color: #aab5c5;
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(
                auto-fit, minmax(min(100%, 240px), 1fr)
            );
            gap: 20px;
            max-width: 1200px;
            margin: auto;
        }

        .card {
            background: #1b2330;
            border-radius: 12px;
            padding: 10px;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 260px;
            object-fit: contain;
            cursor: pointer;
            display: block;
        }

        .filename {
            font-size: 13px;
            color: #c5cede;
            overflow-wrap: anywhere;
            padding: 10px 2px 2px;
        }

        .viewer {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .94);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10;
        }

        .viewer.open {
            display: flex;
        }

        .viewer img {
            max-width: 95%;
            max-height: 90vh;
            object-fit: contain;
        }

        .close {
            position: absolute;
            top: 12px;
            right: 24px;
            color: white;
            background: transparent;
            border: 0;
            font-size: 38px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <header>
        <h1>My Image Gallery</h1>
        <p>Images uploaded to my collection</p>
    </header>

    <p id="status">Loading images...</p>
    <main id="gallery" class="gallery"></main>

    <div id="viewer" class="viewer">
        <button id="close" class="close" aria-label="Close">&times;</button>
        <img id="largeImage" alt="Expanded image">
    </div>

    <script>
        const gallery = document.getElementById("gallery");
        const status = document.getElementById("status");
        const viewer = document.getElementById("viewer");
        const largeImage = document.getElementById("largeImage");

        async function loadImages() {
            try {
                const response = await fetch(
                    "./images.json?t=" + Date.now()
                );

                if (!response.ok) {
                    throw new Error("Image list not found.");
                }

                const images = await response.json();

                if (!Array.isArray(images)) {
                    throw new Error("Invalid image list.");
                }

                gallery.replaceChildren();

                if (images.length === 0) {
                    status.textContent = "No images uploaded yet.";
                    return;
                }

                let displayed = 0;

                for (const name of images) {
                    if (
                        typeof name !== "string" ||
                        !/^[^/\\]+$/.test(name) ||
                        !/\.(jpg|jpeg|png|webp|gif)$/i.test(name)
                    ) {
                        continue;
                    }

                    const card = document.createElement("article");
                    card.className = "card";

                    const img = document.createElement("img");
                    img.src = "./images/" + encodeURIComponent(name);
                    img.alt = name;
                    img.loading = "lazy";

                    img.addEventListener("click", () => {
                        largeImage.src = img.src;
                        largeImage.alt = name;
                        viewer.classList.add("open");
                    });

                    const label = document.createElement("div");
                    label.className = "filename";
                    label.textContent = name;

                    card.append(img, label);
                    gallery.appendChild(card);
                    displayed++;
                }

                status.textContent = displayed
                    ? `${displayed} image(s) in your gallery`
                    : "No images uploaded yet.";

            } catch (error) {
                status.textContent =
                    "Unable to load images. Check that images.json exists in your repository.";
                console.error(error);
            }
        }

        function closeViewer() {
            viewer.classList.remove("open");
            largeImage.removeAttribute("src");
        }

        document.getElementById("close")
            .addEventListener("click", closeViewer);

        viewer.addEventListener("click", event => {
            if (event.target === viewer) closeViewer();
        });

        document.addEventListener("keydown", event => {
            if (event.key === "Escape") closeViewer();
        });

        loadImages();
    </script>
</body>
</html>
